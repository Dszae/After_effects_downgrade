<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Studio Slate to AE Midnight Indigo -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f0a38"/>
      <stop offset="100%" stop-color="#0b0316"/>
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <!-- Glyph Fill -->
    <linearGradient id="glyphGrad" x1="0" y1="18" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <!-- Motion Keyframe Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="42" y1="6" x2="56" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Subtle Specular Inner Rim -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- "Ae" Typography (Clean geometric vector paths) -->
  <g fill="url(#glyphGrad)">
    <!-- Letter 'A' -->
    <path d="M11 44.5 L20.5 20 L25.5 20 L35 44.5 L29.6 44.5 L27.4 38.6 L18.6 38.6 L16.4 44.5 Z M20.2 34.2 L25.8 34.2 L23 25.5 Z"/>
    
    <!-- Letter 'e' -->
    <path d="M47 37 C46.5 41.5 43 45 38 45 C32.5 45 28.5 40.5 28.5 33.5 C28.5 26.5 32.5 22 38.5 22 C44 22 47.5 26 47.5 32.5 C47.5 33.2 47.4 33.8 47.3 34.2 L33.5 34.2 C33.8 38.2 35.8 41 39 41 C41 41 42.5 40 43.2 38.2 Z M43 30.5 C42.7 27.2 40.8 25.5 38.4 25.5 C36 25.5 34.2 27.2 33.8 30.5 Z" transform="translate(3, 0)"/>
  </g>

  <!-- Creative Motion Keyframe Diamond Accent (Top-Right) -->
  <g transform="translate(48.5, 14.5)">
    <!-- Outer Cyan/Purple Keyframe Diamond -->
    <rect x="-5.5" y="-5.5" width="11" height="11" rx="1.5" transform="rotate(45)" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Core Spark -->
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    <!-- Micro Downgrader Arrow Accent -->
    <polyline points="-3.5,9.5 0,13 3.5,9.5" fill="none" stroke="#c084fc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
